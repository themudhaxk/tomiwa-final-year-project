services:
  # ── Backend API ──
  - type: web
    name: sapps-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sapps-db
          property: connectionString
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: FRONTEND_URL
        value: "https://sapps-frontend.onrender.com"

  # ── Frontend ──
  - type: web
    name: sapps-frontend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://sapps-api.onrender.com"

databases:
  - name: sapps-db
    region: frankfurt
    plan: free
